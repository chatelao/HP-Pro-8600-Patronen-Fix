name: Unpack Firmware Packages

on:
  push:
    paths:
      - 'img/**'
      - 'scripts/decode.py'
      - '.github/workflows/unpack-firmware.yml'
  pull_request:
    paths:
      - 'img/**'
      - 'scripts/decode.py'
      - '.github/workflows/unpack-firmware.yml'
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Path to firmware file, backup, or directory'
        required: false
        default: 'img'
        type: string
      backup_password:
        description: 'Password for .enc bksettings backup decryption (optional)'
        required: false
        default: ''
        type: string

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome xmltodict

      - name: Run Firmware Decryption & Full Filesystem Extraction
        env:
          TARGET_PATH: ${{ github.event.inputs.target_path || 'img' }}
          BACKUP_PASSWORD: ${{ github.event.inputs.backup_password || '' }}
        run: |
          TARGET_PATH="${TARGET_PATH:-img}"
          python3 scripts/decode.py "$TARGET_PATH" "$BACKUP_PASSWORD"

      - name: Verify Extracted Filesystem & ZIP Asset
        run: |
          if [ -d "decoded_output" ] && [ "$(ls -A decoded_output)" ]; then
            echo "Successfully unpacked firmware artifacts and extracted filesystem:"
            ls -lh decoded_output/

            if [ -f "unpacked_filesystem.zip" ]; then
              echo "Unencrypted zip asset produced successfully:"
              ls -lh unpacked_filesystem.zip
            else
              echo "Error: unpacked_filesystem.zip asset was not generated!"
              exit 1
            fi

            echo "Evaluating readability and structure of unpacked artifacts and zip asset..."
            python3 -c "import textwrap; exec(textwrap.dedent('''
              import os, sys, zipfile
              from pathlib import Path

              output_dir = Path('decoded_output')
              files = [f for f in output_dir.rglob('*') if f.is_file()]

              if not files:
                  print('Error: No files found in decoded_output')
                  sys.exit(1)

              print(f'Total unpacked filesystem files found: {len(files)}')

              zip_path = Path('unpacked_filesystem.zip')
              if not zip_path.exists() or zip_path.stat().st_size == 0:
                  print('Error: Zip asset is missing or empty!')
                  sys.exit(1)

              with zipfile.ZipFile(zip_path, 'r') as zf:
                  namelist = zf.namelist()
                  print(f'Zip archive contains {len(namelist)} entries.')
                  for member in zf.infolist():
                      if member.flag_bits & 0x1:
                          print(f'Error: Zip entry {member.filename} is encrypted!')
                          sys.exit(1)

              print('Verification complete: Unencrypted zip asset and extracted filesystem are valid.')
            '''))"
          else
            echo "Error: No decoded artifacts were produced."
            exit 1
          fi

      - name: Upload Unpacked Filesystem ZIP Asset
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-filesystem-zip
          path: |
            unpacked_filesystem.zip
            decoded_output/
          if-no-files-found: error
